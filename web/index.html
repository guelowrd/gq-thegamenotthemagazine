<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoQuizz</title>
    <!-- Bread's mobile app opens the game fullscreen, on GeoQuizz's background (theme.css keeps clear of Bread's button) -->
    <meta name="bread-display" content="fullscreen" />
    <meta name="theme-color" content="#0c0827" />
    <meta name="description" content="Find ten cities on the map, and post your record to challenge rivals to beat it for Gamecoins!" />
    <!-- link previews (X and others); %SITE_URL% is filled in at build time, see vite.config.ts -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GeoQuizz" />
    <meta property="og:title" content="GeoQuizz • The World Is Your Arena" />
    <meta property="og:description" content="Find ten cities on the map, and post your record to challenge rivals to beat it for Gamecoins!" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/brand/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta property="og:image:alt" content="GeoQuizz: two pixel-art rivals on a glowing globe, under the words The world is your arena" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image:alt" content="GeoQuizz: two pixel-art rivals on a glowing globe, under the words The world is your arena" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
